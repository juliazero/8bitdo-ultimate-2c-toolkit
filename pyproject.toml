[project]
name = "u2c-customfw"
version = "1.2.0"
description = "Back up, patch and repair the firmware of the 8BitDo Ultimate 2C Wireless controller (firmware 1.09)"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["pyusb>=1.2.1; sys_platform == 'linux'", "evdev>=1.7; sys_platform == 'linux'", "hidapi>=0.14.0; sys_platform == 'win32'"]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1", "QtPy>=2.4,<3; sys_platform == 'linux'", "PySide6>=6.8,<7; sys_platform == 'linux'"]

[project.scripts]
u2c-customfw = "u2c_customfw.cli:main"

[project.gui-scripts]
u2c-customfw-desktop = "u2c_customfw.desktop:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["u2c_customfw*"]

[tool.setuptools.package-data]
u2c_customfw = ["firmware/blobs/*", "web/static/*"]
